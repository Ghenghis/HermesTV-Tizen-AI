# upstream/docker-vps/VPS_COMPOSE.yml — HermesTV VPS IPTV proxy/EPG stack
# Project: hermestv-vps
# Run: docker compose -p hermestv-vps up -d
#
# Credentials: All secrets stay in /home/operator/private/ on the VPS.
#              Enter M3U URLs and provider tokens via each service's admin UI at runtime.
#              Never add real credential values to this file or any committed file.
#
# This stack is separate from and must never share a network with:
#   - docker/vps/compose.yml (hermestv-vps control plane: Postgres, Redis, Caddy, hermestv-api)
#   - docker/workstation/compose.yml (hermestv-workstation: Jellyfin, Tunarr, Dispatcharr, Ollama)
#   - Any daveai-web project containers
#
# VPS target: Hostinger Linux VPS (Ubuntu 22.04, KVM)
# BLOCKER: SSH access to VPS not yet configured — see docs/research/BLOCKER_VPS_SSH.md

services:

  # ---------------------------------------------------------------------------
  # Threadfin — M3U proxy for Jellyfin/Emby EPG
  # Successor to xTeVe — actively maintained, native Jellyfin support, REST API
  # Admin UI: http://<vps-tailscale-ip>:34400/web
  # Configure M3U sources and XMLTV EPG in the admin UI — no credentials here
  # GitHub: https://github.com/Threadfin-Org/Threadfin
  # ---------------------------------------------------------------------------
  threadfin:
    image: ghcr.io/threadfin/threadfin:latest
    container_name: hermestv-vps-threadfin
    environment:
      # Port threadfin listens on inside the container
      THREADFIN_PORT: "34400"
      # Threadfin config and data directory inside container
      THREADFIN_HOME: /home/threadfin
      # Branch/version label — informational only
      THREADFIN_BRANCH: main
      # Credentials: DO NOT add THREADFIN_M3U or provider URLs here.
      # Enter M3U playlist URLs and provider tokens via the admin UI at runtime.
    volumes:
      - hermestv-vps-threadfin-data:/home/threadfin
    ports:
      - "34400:34400"
    restart: unless-stopped
    networks:
      - hermestv-vps-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:34400/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # m3u-editor — Web-based M3U playlist editor
  # Manage, filter, and reorder M3U playlists through a browser UI
  # Admin UI: http://<vps-tailscale-ip>:4200
  # Enter M3U source URLs in the UI at runtime — no credentials in this file
  # GitHub: https://github.com/sparkison/m3u-editor
  # ---------------------------------------------------------------------------
  m3u-editor:
    image: ghcr.io/sparkison/m3u-editor:latest
    container_name: hermestv-vps-m3u-editor
    environment:
      # Port the editor web UI listens on
      APP_PORT: "4200"
      # Credentials: DO NOT add M3U source URLs or provider tokens here.
      # All playlist sources are configured via the web UI and stored in the
      # mounted volume (hermestv-vps-m3u-editor-data).
    volumes:
      - hermestv-vps-m3u-editor-data:/config
    ports:
      - "4200:4200"
    restart: unless-stopped
    networks:
      - hermestv-vps-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # xtreamfilter — Xtream API stream filter
  # Filter and transform Xtream Codes API streams by category, quality, or name
  # Admin UI: http://<vps-tailscale-ip>:3456
  # Enter Xtream credentials in the UI at runtime — no credentials in this file
  # GitHub: https://github.com/SpanishST/xtreamfilter
  # ---------------------------------------------------------------------------
  xtreamfilter:
    image: ghcr.io/spanishst/xtreamfilter:latest
    container_name: hermestv-vps-xtreamfilter
    environment:
      # Port xtreamfilter listens on
      PORT: "3456"
      # Credentials: DO NOT add XTREAM_URL, XTREAM_USERNAME, or XTREAM_PASSWORD here.
      # Enter Xtream provider credentials via the admin UI at runtime.
      # They are stored in the mounted volume (hermestv-vps-xtreamfilter-data).
    volumes:
      - hermestv-vps-xtreamfilter-data:/config
    ports:
      - "3456:3456"
    restart: unless-stopped
    networks:
      - hermestv-vps-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3456"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # hermes-tv-api — HermesTV backend API (Express)
  # Serves /health, /api/settings, /api/layouts, /api/upstream-apps, etc.
  # Build from local source — run: docker compose build hermes-tv-api
  #
  # PORT NOTE (Phase 1.5 remediation, 2026-05-18):
  # On this VPS, port 3001 is already bound by an existing next-server
  # (Dave's daveai.tech stack) — see docs/20_VPS_PHASE_1_AUDIT_FINDINGS.md.
  # HermesTV's API moves to port 3011 to avoid the conflict. Local dev still
  # uses 3001 (see services/hermes-tv-api/.env.example).
  # ---------------------------------------------------------------------------
  hermes-tv-api:
    build:
      # Build context is the repo root so the Dockerfile can COPY
      # apps/hermes-web-tv/src/layouts/manifests/ and upstream/apps-catalog.json
      # — both of which the API serves (see /api/layouts, /api/upstream-apps).
      context: ../..
      dockerfile: services/hermes-tv-api/Dockerfile
    container_name: hermestv-vps-api
    # env_file path is relative to THIS compose file location. Operator places
    # /home/operator/hermestv/.env (mode 0600); from upstream/docker-vps/ that's
    # ../../.env. The file is gitignored. Optional: missing file → empty env
    # (the `required: false` Compose v2.24+ flag would express this, but
    # operator runbook guarantees the file exists before `up`).
    env_file:
      - ../../.env
    environment:
      # Explicit fallbacks — env_file values win, these are only used if the
      # .env file is missing the key entirely.
      NODE_ENV: production
      PORT: "3011"
    # Phase 2: bind 127.0.0.1:3011 → container 3011 so the host nginx
    # at /etc/nginx/sites-enabled/hermestv.daveai.tech can reverse-proxy
    # /api/ and /health to us. 127.0.0.1 only — never 0.0.0.0 — so the
    # public internet cannot reach the container directly.
    ports:
      - "127.0.0.1:3011:3011"
    restart: unless-stopped
    networks:
      - hermestv-vps-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # hermes-web-tv — HermesTV React web app (nginx)
  # Serves the Vite-built SPA. Host nginx (NOT this nginx) is the edge.
  # Build from local source — run: docker compose build hermes-web-tv
  # Mom (Sherri) on QN85 accesses this via Samsung Internet browser
  # Dave accesses this from his Windows workstation browser
  # ---------------------------------------------------------------------------
  hermes-web-tv:
    build:
      context: ../../apps/hermes-web-tv
      dockerfile: Dockerfile
    container_name: hermestv-vps-web
    # Phase 2: bind 127.0.0.1:3080 → container 80. Port 8081 was the original
    # plan but live discovery in Phase 1.5 found it bound by kilocode python;
    # 3080 confirmed free (see docs/20_VPS_PHASE_1_AUDIT_FINDINGS.md).
    # 127.0.0.1 only — host nginx is the only edge for the public internet.
    ports:
      - "127.0.0.1:3080:80"
    restart: unless-stopped
    networks:
      - hermestv-vps-internal
    depends_on:
      - hermes-tv-api
    healthcheck:
      # Use 127.0.0.1 not 'localhost': alpine wget prefers ::1 and our nginx
      # only listens on IPv4 (0.0.0.0:80), so 'localhost' returns Connection
      # refused. Discovered during Phase 2 deploy 2026-05-18.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Caddy — REMOVED in Phase 2.
  #
  # Original plan: ship Caddy in-stack to terminate TLS for HermesTV.
  # Phase 1 audit (2026-05-18) showed the VPS already runs host-level nginx
  # on ports 80/443 for 10 daveai.tech sites with Cloudflare-proxied DNS
  # (Flexible mode: edge terminates TLS, origin is HTTP-only). Running our
  # own Caddy in addition would compete for 80/443 and break everything.
  #
  # Decision: HermesTV's edge is the existing host nginx, configured by the
  # operator-installed site config in upstream/nginx/hermestv.daveai.tech.conf
  # (already deployed in Phase 1.5). HermesTV exposes only 127.0.0.1:3011 and
  # 127.0.0.1:3080; host nginx proxies hermestv.daveai.tech → those loopback
  # ports.
  #
  # The Caddyfile at upstream/docker-vps/Caddyfile is preserved as reference
  # for a future option to switch to Caddy edge if the operator deprecates
  # the host nginx. It is NOT used by this compose stack.
  # ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Network
# hermestv-vps-internal is a private bridge network shared only by the
# services in this file. It is never connected to hermestv-internal
# (workstation), hermestv-vps-internal from docker/vps/compose.yml, or
# any daveai-web project network.
# ---------------------------------------------------------------------------
networks:
  hermestv-vps-internal:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# All volumes are prefixed hermestv-vps- to avoid collisions with other
# Compose projects. Named volumes persist across container restarts.
# Credentials entered via admin UIs are stored in these volumes on the VPS.
# ---------------------------------------------------------------------------
volumes:
  hermestv-vps-threadfin-data:
    name: hermestv-vps-threadfin-data
  hermestv-vps-m3u-editor-data:
    name: hermestv-vps-m3u-editor-data
  hermestv-vps-xtreamfilter-data:
    name: hermestv-vps-xtreamfilter-data
  # hermestv-vps-caddy-data and -config removed in Phase 2 — Caddy
  # service is no longer in this stack. Host nginx is the edge.
