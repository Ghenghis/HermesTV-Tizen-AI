# docker/workstation/compose.yml — HermesTV workstation heavy services
# Project: hermestv-workstation
# Run: docker compose -p hermestv-workstation up -d
# Credentials: All secrets are in G:\private\ — never add keys to this file
# GPU: RTX 3090 Ti — NVIDIA runtime enabled for Jellyfin (NVENC/NVDEC) and Ollama (LLM inference)
# Requires: nvidia-container-toolkit installed on host (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html)

services:
  hermes-tv-api:
    image: node:20-alpine
    working_dir: /app
    volumes: ['../../services/hermes-tv-api:/app']
    command: npm start
    ports: ['3001:3001']
    environment:
      NODE_ENV: production
      PORT: '3001'
    restart: unless-stopped
    networks: [hermestv-internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  jellyfin:
    image: jellyfin/jellyfin:latest
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Media paths are mounted by operator — not hardcoded here
    ports: ['8096:8096']
    restart: unless-stopped
    networks: [hermestv-internal]
    # RTX 3090 Ti hardware transcoding via NVENC/NVDEC
    runtime: nvidia
    environment:
      JELLYFIN_PublishedServerUrl: http://hermestv.local:8096
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

  tunarr:
    image: ghcr.io/chrisbenincasa/tunarr:edge
    volumes:
      - tunarr-data:/home/node/app/.tunarr
    ports: ['8000:8000']
    restart: unless-stopped
    networks: [hermestv-internal]
    depends_on: [jellyfin]

  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    volumes:
      - dispatcharr-data:/app/data
    ports: ['9191:9191']
    restart: unless-stopped
    networks: [hermestv-internal]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    volumes:
      - open-webui-data:/app/backend/data
    ports: ['3000:8080']
    restart: unless-stopped
    networks: [hermestv-internal]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: 'true'

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports: ['11434:11434']
    restart: unless-stopped
    networks: [hermestv-internal]
    # RTX 3090 Ti GPU acceleration for local LLM inference
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all

networks:
  hermestv-internal:
    driver: bridge
    internal: false

volumes:
  jellyfin-config:
  jellyfin-cache:
  tunarr-data:
  dispatcharr-data:
  open-webui-data:
  ollama-data:
