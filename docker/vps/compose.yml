# docker/vps/compose.yml — HermesTV VPS control plane services
# Project: hermestv-vps
# Run: docker compose -p hermestv-vps up -d
# VPS role: Postgres, Redis, Caddy (TLS termination), hermes-tv-api (VPS instance)
# VPS does NOT run: Jellyfin, Tunarr, Dispatcharr, Ollama, Open WebUI
# All AI and media stay on the workstation

services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: hermestv
      POSTGRES_USER: hermestv
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    restart: unless-stopped
    networks: [hermestv-vps-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermestv"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped
    networks: [hermestv-vps-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  hermes-tv-api:
    image: node:20-alpine
    working_dir: /app
    volumes: ['./hermes-tv-api:/app:ro']
    command: node src/index.js
    environment:
      NODE_ENV: production
      # Phase 1.5: 3001 → 3011 — VPS port 3001 already bound by Dave's
      # next-server. See docs/20_VPS_PHASE_1_AUDIT_FINDINGS.md.
      PORT: '3011'
      # Credentials injected at runtime — never in image or compose file
    # Phase 2: bind 127.0.0.1:3011 so host nginx can reach us. 127.0.0.1
    # only — never 0.0.0.0 — the public internet must go through host nginx.
    ports:
      - '127.0.0.1:3011:3011'
    restart: unless-stopped
    networks: [hermestv-vps-internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Caddy — REMOVED in Phase 2.
  #
  # The host already runs nginx on 80/443 with 10 daveai.tech sites under
  # Cloudflare-Flexible (origin HTTP-only, edge TLS at Cloudflare). Running
  # another reverse proxy here would compete for those ports and break the
  # public sites. HermesTV's edge is the operator-installed host nginx site
  # at /etc/nginx/sites-enabled/hermestv.daveai.tech (deployed in Phase 1.5,
  # template at upstream/nginx/hermestv.daveai.tech.conf.example). The site
  # config's server_name now lists BOTH tv.daveai.tech (canonical) and
  # hermestv.daveai.tech (historical alias) so existing links keep working.
  #
  # If you ever migrate this VPS off host nginx, the Caddyfile at
  # upstream/docker-vps/Caddyfile is still here as a reference starter.

secrets:
  pg_password:
    file: ./secrets/pg_password.txt

networks:
  hermestv-vps-internal:
    driver: bridge
    internal: true
  # hermestv-vps-external network removed in Phase 2 — only Caddy used it,
  # and Caddy is gone (host nginx is the edge).

volumes:
  postgres-data:
  redis-data:
  # caddy-data and caddy-config volumes removed in Phase 2 (Caddy gone).
